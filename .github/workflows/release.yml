name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          # A PAT/App token makes CI run on the Release PR; the default token does not trigger workflows.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  publish:
    name: Build ${{ matrix.rid }}
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            platform: x64
          - rid: win-arm64
            platform: ARM64
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      APP_PROJECT: src/WindowsTools.App/WindowsTools.App.csproj
    steps:
      - uses: actions/checkout@v4

      - name: Detect app project
        id: app
        shell: pwsh
        run: |
          $found = Test-Path $env:APP_PROJECT
          "exists=$($found.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if (-not $found) { Write-Host "::warning::$env:APP_PROJECT not found - release has no binaries." }

      - uses: actions/setup-dotnet@v4
        if: steps.app.outputs.exists == 'true'
        with:
          global-json-file: global.json

      - name: Publish
        if: steps.app.outputs.exists == 'true'
        run: >
          dotnet publish ${{ env.APP_PROJECT }} -c Release
          -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }}
          --self-contained true -p:WindowsAppSDKSelfContained=true
          -o publish/${{ matrix.rid }}

      - name: Package and upload
        if: steps.app.outputs.exists == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "WindowsTools-$env:TAG-${{ matrix.rid }}.zip"
          Compress-Archive -Path "publish/${{ matrix.rid }}/*" -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File "$zip.sha256" -Encoding ascii
          gh release upload $env:TAG $zip "$zip.sha256" --clobber
